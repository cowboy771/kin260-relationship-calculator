<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kin260 Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        // Reports this page's real content height to whatever window is
        // embedding it (e.g. the Squarespace iframe), so the iframe can
        // resize to fit exactly — no inner scrollbar, no double-scroll.
        // Paired with a small listener script in the Squarespace embed
        // code block that reads this message and sets the iframe height.
        function sendHeight() {
          var height = document.documentElement.scrollHeight;
          window.parent.postMessage({ type: 'kin260-resize', height: height }, '*');
        }
        window.addEventListener('load', sendHeight);
        window.addEventListener('resize', sendHeight);
        if (window.ResizeObserver) {
          new ResizeObserver(sendHeight).observe(document.body);
        }
        // Catch content changes that don't fire a resize event on their
        // own (e.g. React swapping the calculated chart into view).
        new MutationObserver(sendHeight).observe(document.body, {
          childList: true, subtree: true, attributes: true,
        });
        // A few follow-up pings catch late-loading fonts/images shifting
        // the layout slightly after the initial paint.
        setTimeout(sendHeight, 300);
        setTimeout(sendHeight, 1000);
      })();
    </script>
  </body>
</html>
